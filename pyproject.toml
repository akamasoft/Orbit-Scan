[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbite-scan"
version = "1.0.2"
description = "Orbite Scan — supervision et visualisation réseau"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Akamasoft" },
    { name = "HaxL0p4", email = "haxl0p4@proton.me" },
]
requires-python = ">=3.11"
keywords = ["network", "scanner", "nmap", "security", "visualization", "kali"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy",
    "psutil",
    "requests",
    "PyQt6",
    "PyQt6-WebEngine",
]

[project.urls]
Homepage = "https://github.com/akamasoft/Orbit-Scan"
"Bug Tracker" = "https://github.com/akamasoft/Orbit-Scan/issues"

[project.scripts]
orbite-scan = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.setuptools.package-data]
"core" = ["oui.csv"]
"ui" = ["assets/*"]
"ui.assets" = ["*"]
